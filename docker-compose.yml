services:
  app:
    build: .
    container_name: images-server
    ports:
      - "8000:8000"
    volumes:
      - images:/app/images
      - logs:/app/logs
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: image_server
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: images-db
    environment:
      POSTGRES_DB: image_server
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: images-nginx
    ports:
      - "8080:80"
    volumes:
      - images:/images:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  images:
  logs:
  postgres_data:
