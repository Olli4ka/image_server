services:
  app:
    build: .
    container_name: images-server
    ports:
      - "8000:8000"
    volumes:
      - images:/app/images
      - logs:/app/logs

  nginx:
    image: nginx:alpine
    container_name: images-nginx
    ports:
      - "8080:80"
    volumes:
      - images:/images:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app


volumes:
  images:
  logs:
