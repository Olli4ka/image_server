<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Upload Image</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
```

</head>

<body>

<main class="container py-5">

```
<section class="text-center mb-5">
    <h1 class="display-6 fw-bold">Upload Photos</h1>

    <p class="lead text-secondary">
        Upload selfies, memes, or any fun pictures here.
    </p>
</section>

<nav class="nav nav-pills justify-content-center mb-4">
    <a
        href="/upload"
        class="nav-link active"
        aria-current="page"
    >
        Upload Image
    </a>

    <a
        href="/images-list"
        class="nav-link"
    >
        Images List
    </a>
</nav>

<section class="mx-auto" style="max-width: 700px;">

    <div
        class="border border-2 rounded-4 p-5 text-center bg-light"
    >
        <div class="mb-3">
            <img
                src="/static/img/upload-cloud.png"
                alt="Upload"
                width="64"
                height="64"
            >
        </div>

        <h2 class="h4 mb-3">
            Select an image to upload
        </h2>

        <p class="text-secondary mb-2">
            Choose a file or drag and drop it here.
        </p>

        <p class="small text-secondary mb-4">
            Supported formats: JPG, PNG, GIF<br>
            Maximum file size: 5 MB
        </p>

        <input
            type="file"
            id="file-upload"
            class="d-none"
            accept=".jpg,.jpeg,.png,.gif"
        >

        <label
            for="file-upload"
            class="btn btn-primary"
        >
            Browse your file
        </label>
    </div>

    <div class="mt-5">
        <h2 class="h4 mb-3">Current Upload</h2>

        <div class="input-group">
            <input
                type="text"
                id="upload-link"
                class="form-control"
                placeholder="Uploaded image link"
                readonly
            >

            <button
                type="button"
                id="copy-link"
                class="btn btn-outline-secondary"
                disabled
            >
                Copy
            </button>
        </div>
    </div>

</section>
```

</main>

<script src="/static/js/upload.js"></script>

</body>
</html>
