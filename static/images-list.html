<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title class="display-6 fw-bold">Images List</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f7ff;
        }

        .page-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .preview {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }

        .delete-button {
            padding: 4px;
            border: none;
            background: transparent;
        }

        .delete-icon {
            width: 24px;
            height: 24px;
        }

        .images-table {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .images-table th {
            font-weight: 500;
            color: #6c757d;
            white-space: nowrap;
        }

        .images-table td {
            vertical-align: middle;
        }
    </style>
</head>

<body>

<div class="page-container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Images List</h1>

        <nav class="nav nav-pills justify-content-center mb-4">
            <a href="/upload" class="nav-link">
                Upload Image
            </a>
        </nav>
    </div>

    <div id="images-container">
        <!-- Images will be loaded here -->
    </div>

</div>

<script src="/static/js/images-list.js"></script>

</body>
</html>
